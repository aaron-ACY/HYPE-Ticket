name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # JOB 1: Backend Test (Java 21 + Maven + Redis Container)
  # ========================================================
  backend-test:
    name: Backend Test & Verification
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: event_ticketing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Tests
        working-directory: ./hype-api
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/event_ticketing?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: |
          mvn clean test -B

      - name: Upload Backend Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: hype-api/target/surefire-reports/
          retention-days: 7

  # ========================================================
  # JOB 2: Frontend Test & Build (Node.js 20 + Vite)
  # ========================================================
  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./hype-fe/package-lock.json

      - name: Install Dependencies
        working-directory: ./hype-fe
        run: npm ci

      - name: Run Linting (Oxlint)
        working-directory: ./hype-fe
        run: npm run lint

      - name: Build Frontend with Vite
        working-directory: ./hype-fe
        run: npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: hype-fe/dist/
          retention-days: 7

  # ========================================================
  # JOB 3: Docker Build (Docker Images)
  # ========================================================
  docker-build:
    name: Build Docker Images
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./hype-api
          file: ./hype-api/Dockerfile
          push: false
          tags: hype-api:latest
          cache-from: type=gha,scope=hype-api
          cache-to: type=gha,mode=max,scope=hype-api

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./hype-fe
          file: ./hype-fe/Dockerfile
          push: false
          tags: hype-fe:latest
          cache-from: type=gha,scope=hype-fe
          cache-to: type=gha,mode=max,scope=hype-fe
